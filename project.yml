name: iOSAntigravity
options:
  bundleIdPrefix: dev.antigravity.ios
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.1"
  generateEmptyDirectories: true

settings:
  base:
    ANTIGRAVITY_BUNDLE_PREFIX: dev.antigravity.ios
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 iOSAntigravity Contributors. Original app icon & client code. Independent third-party companion for Antigravity; Google and Antigravity are trademarks of Google LLC."

packages:
  AntigravityData:
    path: Packages/AntigravityData

targets:
  Antigravity:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes:
          - "**/Info.plist"
      - path: Shared
      - path: Extensions/LiveActivity
        excludes:
          - "**/*Bundle*"
          - "**/Info.plist"
    dependencies:
      - package: AntigravityData
      - target: AntigravityLiveActivity
        embed: true
      - target: AntigravityShare
        embed: true
    info:
      path: iOS/Support/Info.plist
      properties:
        CFBundleDisplayName: "AG Orbit"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 iOSAntigravity Contributors. Original app icon & client code. Independent third-party companion for Antigravity; Google and Antigravity are trademarks of Google LLC."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "Scan the Remote Control QR code from your paired desktop host."
        NSMicrophoneUsageDescription: "Dictate prompts in AG Orbit using real-time voice transcription."
        NSFaceIDUsageDescription: "Authorize agent terminal commands and external permissions with Face ID."
        NSLocalNetworkUsageDescription: "Connect directly to your paired desktop host or Companion Bridge over LAN and Tailscale."
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.antigravity.ios.deeplink
            CFBundleURLSchemes:
              - antigravity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ANTIGRAVITY_BUNDLE_PREFIX).app
        INFOPLIST_KEY_CFBundleDisplayName: "AG Orbit"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic

  AntigravityLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/LiveActivity
        excludes:
          - "**/Info.plist"
      - path: Shared/LiveActivity
      - path: Shared/DesignSystem
    dependencies:
      - package: AntigravityData
    info:
      path: Extensions/LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: "AG Orbit Live Activity"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 iOSAntigravity Contributors. Independent companion for Antigravity."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ANTIGRAVITY_BUNDLE_PREFIX).app.LiveActivity
        INFOPLIST_KEY_CFBundleDisplayName: "AG Orbit Live Activity"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic

  AntigravityShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Share
        excludes:
          - "**/Info.plist"
      - path: Shared/DesignSystem
    dependencies:
      - package: AntigravityData
    info:
      path: Extensions/Share/Info.plist
      properties:
        CFBundleDisplayName: "Send to AG Orbit"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 iOSAntigravity Contributors. Independent companion for Antigravity."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).AntigravityShareExtensionViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ANTIGRAVITY_BUNDLE_PREFIX).app.Share
        INFOPLIST_KEY_CFBundleDisplayName: "Send to AG Orbit"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ANTIGRAVITY_SHARE_EXTENSION"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic

  AntigravityUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iOSUITests
    dependencies:
      - target: Antigravity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ANTIGRAVITY_BUNDLE_PREFIX).app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Antigravity
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic

schemes:
  Antigravity:
    build:
      targets:
        Antigravity: all
        AntigravityUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: AntigravityUITests
