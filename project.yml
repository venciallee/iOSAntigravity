name: iOSAntigravity
options:
  bundleIdPrefix: dev.antigravity.ios
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.1"
  generateEmptyDirectories: true

packages:
  AntigravityData:
    path: Packages/AntigravityData

targets:
  Antigravity:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      - path: Extensions/LiveActivity
        excludes:
          - "**/*Bundle*"
    dependencies:
      - package: AntigravityData
      - target: AntigravityLiveActivity
        embed: true
      - target: AntigravityShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.antigravity.ios.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan the Remote Control QR code from Antigravity Desktop to pair your device."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Dictate prompts to Antigravity using real-time voice transcription."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Authorize agent terminal commands and external permissions with Face ID."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        SWIFT_VERSION: "6.0"

  AntigravityLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/LiveActivity
      - path: Shared/LiveActivity
      - path: Shared/DesignSystem
    dependencies:
      - package: AntigravityData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.antigravity.ios.app.LiveActivity
        SWIFT_VERSION: "6.0"

  AntigravityShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Share
      - path: Shared/DesignSystem
    dependencies:
      - package: AntigravityData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.antigravity.ios.app.Share
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ANTIGRAVITY_SHARE_EXTENSION"
        SWIFT_VERSION: "6.0"
