name: iOSAntigravity
options:
  bundleIdPrefix: dev.antigravity.ios
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.1"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"

packages:
  AntigravityData:
    path: Packages/AntigravityData

targets:
  Antigravity:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes:
          - "**/Info.plist"
      - path: Shared
      - path: Extensions/LiveActivity
        excludes:
          - "**/*Bundle*"
          - "**/Info.plist"
    dependencies:
      - package: AntigravityData
      - target: AntigravityLiveActivity
        embed: true
      - target: AntigravityShare
        embed: true
    info:
      path: iOS/Support/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "Scan the Remote Control QR code from Antigravity Desktop to pair your device."
        NSMicrophoneUsageDescription: "Dictate prompts to Antigravity using real-time voice transcription."
        NSFaceIDUsageDescription: "Authorize agent terminal commands and external permissions with Face ID."
        NSLocalNetworkUsageDescription: "Connect directly to Antigravity Desktop or Mac Companion Bridge over LAN and Tailscale."
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.antigravity.ios.deeplink
            CFBundleURLSchemes:
              - antigravity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.antigravity.ios.app
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic

  AntigravityLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/LiveActivity
        excludes:
          - "**/Info.plist"
      - path: Shared/LiveActivity
      - path: Shared/DesignSystem
    dependencies:
      - package: AntigravityData
    info:
      path: Extensions/LiveActivity/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.antigravity.ios.app.LiveActivity
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic

  AntigravityShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Share
        excludes:
          - "**/Info.plist"
      - path: Shared/DesignSystem
    dependencies:
      - package: AntigravityData
    info:
      path: Extensions/Share/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).AntigravityShareExtensionViewController"
          NSExtensionAttributes:
            NSExtensionActivationSupportsText: true
            NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.antigravity.ios.app.Share
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ANTIGRAVITY_SHARE_EXTENSION"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
