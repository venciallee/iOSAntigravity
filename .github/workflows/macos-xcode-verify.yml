name: macOS Xcode & iOS Simulator E2E Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos-simulator-e2e:
    name: Swift 6 XCTest + Xcode Simulator Build + 13-Screen Native Capture
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode 16+ on runner
        run: |
          ls -d /Applications/Xcode*.app
          LATEST_XCODE="$(ls -d /Applications/Xcode_16*.app /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)"
          echo "Using Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen & Pillow
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          python3 -m pip install --break-system-packages --quiet pillow || pip3 install --quiet pillow

      - name: "[Gate 1] Swift 6 Package Compilation & XCTest Suite (AntigravityData)"
        run: |
          set -euo pipefail
          mkdir -p verification/output/real-simulator
          swift test --package-path Packages/AntigravityData 2>&1 | tee verification/output/real-simulator/swift-test.log

      - name: "[Gate 2] Live Connect-RPC Protocol Flow (Login + StartCascade + SendMessage + Binary Proto + Face ID)"
        run: |
          set -euo pipefail
          python3 verification/verify-live-rpc-flow.py 2>&1 | tee verification/output/real-simulator/live-rpc-flow.log

      - name: "[Gate 3 & 4] Xcode Simulator Build + Live App-to-Backend RPC + 13 Native SwiftUI Screenshots"
        run: |
          set -euo pipefail
          python3 verification/ios-simulator-runner.py 2>&1 | tee verification/output/real-simulator/simulator-runner.log

      - name: Upload Real iOS Simulator Screenshots & Verification Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-ios-simulator-verification
          path: verification/output/real-simulator/
          if-no-files-found: warn
